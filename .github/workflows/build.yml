name: _step.build

on:
  workflow_call:
    inputs:
      release:
        type: boolean
        required: false
        default: false
      target_subproject:
        description: see release.yml, leave it empty to build all
        type: string
        required: false
        default: ''
      mixin_audit:
        type: boolean
        required: false
        default: false

jobs:
  matrix_prep:
    uses: ./.github/workflows/matrix_prep.yml
    with:
      target_subproject: ${{ inputs.target_subproject }}

  # One job per Minecraft subproject, so every version produces its own artifact
  # instead of being packed into a single one.
  build:
    needs:
      - matrix_prep
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix_prep.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v7

      # CI resolves Gradle from the official distribution; the repo keeps the
      # Aliyun mirror in gradle-wrapper.properties for faster local downloads.
      # Only the host prefix is rewritten, so the version stays in sync.
      - name: Use the official Gradle distribution in CI
        run: |
          sed -i 's|mirrors.aliyun.com/gradle/distributions/v[0-9.]*/|services.gradle.org/distributions/|' gradle/wrapper/gradle-wrapper.properties
          grep -q 'distributionUrl=https\\://services.gradle.org/distributions/gradle-' gradle/wrapper/gradle-wrapper.properties || { echo 'Gradle mirror URL patch failed'; exit 1; }
          grep '^distributionUrl' gradle/wrapper/gradle-wrapper.properties

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' && github.ref != 'refs/heads/dev' }}
          build-scan-terms-of-use-agree: 'yes'

      - name: Build with gradle
        run: |
          chmod +x gradlew
          echo "Building subproject ${{ matrix.subproject }}"
          ./gradlew :${{ matrix.subproject }}:build
          echo "Building the Velocity-compatible flavour of subproject ${{ matrix.subproject }}"
          ./gradlew :${{ matrix.subproject }}:build -Pvelocity=true
        env:
          BUILD_ID: ${{ github.run_number }}
          BUILD_RELEASE: ${{ inputs.release }}

      - name: Run mixin audit check for Minecraft Server
        if: ${{ inputs.mixin_audit }}
        timeout-minutes: 10
        run: |
          mkdir -p ./run
          echo eula=true > ./run/eula.txt
          ./gradlew runServerMixinAudit

      # Both flavours of the version end up here: the regular build plus the
      # Velocity-compatible one carrying the `-velocity` suffix.
      - name: Collect mod jars
        run: |
          shopt -s extglob
          mkdir mod-jars
          for jar in versions/${{ matrix.subproject }}/build/libs/!(*-@(dev|sources|shadow)).jar; do
              cp -p "$jar" mod-jars/
          done
          ls -l mod-jars

      # The artifact name is the subproject name (i.e. the Minecraft version),
      # so each version can be downloaded on its own.
      - name: Upload mod jars
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.subproject }}
          path: mod-jars/*.jar
          if-no-files-found: error

  summary:
    runs-on: ubuntu-latest
    needs:
      - build

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: 3.12

      - name: Download per-version artifacts
        uses: actions/download-artifact@v8
        with:
          path: mod-jars

      - name: Make build summary
        run: |
          pip install jproperties
          python .github/workflows/scripts/summary.py
        env:
          TARGET_SUBPROJECT: ${{ inputs.target_subproject }}
